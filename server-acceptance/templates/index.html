<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linux服务器验收平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.profile-card{transition:.15s;border:2px solid transparent}.profile-card:has(input:checked){border-color:#0d6efd;background:#f0f6ff}</style>
</head>
<body class="bg-light">
<main class="container py-5" style="max-width:1000px">
  <div class="text-center mb-5"><span class="badge text-bg-primary mb-3">Linux Server Acceptance Platform</span><h1 class="display-6 fw-semibold">Linux服务器验收平台</h1><p class="text-secondary mb-0">面向 Linux、GPU、AI 和 Kubernetes 节点的硬件与环境交付验收。</p></div>
  <form method="post" action="/validate">
    <h2 class="h5 mb-3">请选择验收模板</h2>
    <div class="row g-3 mb-4">
      {% for profile in profiles %}<div class="col-md-6"><label class="card profile-card shadow-sm h-100"><div class="card-body"><div class="d-flex gap-3"><input class="form-check-input mt-1" type="radio" name="profile" value="{{ profile }}" {% if loop.first %}checked{% endif %}><div><h3 class="h5">{{ labels[profile] }}</h3><p class="text-secondary mb-0">{{ descriptions[profile] }}</p></div></div></div></label></div>{% endfor %}
    </div>
    <button class="btn btn-primary btn-lg w-100 shadow-sm" type="submit">开始检测</button>
  </form>
</main>
</body>
</html>
