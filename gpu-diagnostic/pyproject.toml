[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-diagnostic"
version = "0.1.0"
description = "Evidence-driven diagnostics for Linux NVIDIA GPU servers"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gpu-diag = "gpu_diagnostic.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
